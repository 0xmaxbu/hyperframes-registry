<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>preset-sequence-layers — portrait 9:16 宿主</title>
  </head>
  <body>
    <!-- 9:16 宿主：挂 preset-sequence-layers-portrait（同一份 DOM，JS 按 data-width/height 竖屏排布） -->
    <div
      id="stage"
      data-hf-root
      data-composition-id="example-portrait"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="seq-layers"
        data-composition-id="preset-sequence-layers-portrait"
        data-composition-src="compositions/preset-sequence-layers-portrait.html"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
        data-variable-values='{
          "items": [
            { "title": "利息高" },
            { "title": "赤字大" },
            { "title": "发债多" },
            { "title": "溢价高" },
            { "title": "利息更高" }
          ],
          "config": { "interval": 1.4, "duration": 0.8 },
          "accent": "#34d399"
        }'
      ></div>
      <div
        id="drv"
        class="clip"
        data-start="0"
        data-duration="12"
        data-track-index="10"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};
        window.__timelines["example-portrait"] = gsap.timeline({ paused: true });
      })();
    </script>
  </body>
</html>
