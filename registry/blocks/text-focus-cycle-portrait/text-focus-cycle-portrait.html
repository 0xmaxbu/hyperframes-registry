<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Words","description":"Words to cycle focus between, separated by spaces or \\n","default":"成本 效率 规模 网络 飞轮","maxLength":200},
    {"id":"step","type":"number","label":"Step","description":"Seconds the focus rests on each word (0.6-3); loop = step × word count","default":1.2,"min":0.6,"max":3,"step":0.1},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (28-160)","default":88,"min":28,"max":160,"step":2},
    {"id":"blur","type":"number","label":"Blur","description":"Out-of-focus blur in px (2-12)","default":6,"min":2,"max":12,"step":0.5},
    {"id":"color","type":"color","label":"Ink","description":"Out-of-focus word color","default":"#64748b"},
    {"id":"accent","type":"color","label":"Accent","description":"Focused word color","default":"#fbbf24"},
    {"id":"intro","type":"number","label":"Delay","description":"Fade-in seconds before cycling starts (0-2)","default":0.4,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-focus-cycle-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tfc-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #tfc-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8%; }
      #tfc-body { max-width: 100%; text-align: center; font-weight: 800; line-height: 1.6;
        font-family: "Noto Sans SC", sans-serif; }
      .tfc-u { display: inline-block; margin: 0 0.35em; will-change: filter, transform, opacity, color; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="tfc-root"
      data-composition-id="text-focus-cycle-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="tfc-box"><div id="tfc-body"></div></div>
      <div id="tfc-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }
        function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var step = clamp(V.step, 0.6, 3, 1.2);
        var fontSize = clamp(V.font_size, 28, 160, 88);
        var blurMax = clamp(V.blur, 2, 12, 6);
        var ink = V.color || "#64748b";
        var accent = V.accent || "#fbbf24";
        var introDur = clamp(V.intro, 0, 2, 0.4);

        var body = document.getElementById("tfc-body");
        body.style.fontSize = fontSize + "px";

        // 词列表:按空白/换行切(焦点循环的手法单元 = 整词,CJK 词间天然用空格排列)
        var words = String(V.text == null ? "" : V.text).split(/[\s\n]+|\\n/).filter(Boolean);
        if (words.length < 2) words = ["成本", "效率", "规模", "网络", "飞轮"];
        var N = words.length;
        var els = words.map(function (wd, i) {
          var el = document.createElement("span");
          el.className = "tfc-u";
          el.textContent = wd;
          body.appendChild(el);
          if (i < N - 1) body.appendChild(document.createTextNode(" "));
          return el;
        });

        // 对焦模糊轮换:焦点强度 s_i = 环形余弦峰(周期 N·step,整数圈 → 任意 N·step 裁剪无缝)
        var LC = N * step;
        var _t = 0;
        function draw(t) {
          _t = t;
          var pos = t / step;
          for (var i = 0; i < N; i++) {
            var d = pos - i, frac = d - Math.floor(d / N) * N;      // (pos - i) mod N ∈ [0,N)
            var dd = Math.min(frac, N - frac);                       // 环形距离
            var s = smooth(1 - dd / 1.6);                            // 峰宽 ~1.6 词距
            els[i].style.filter = s > 0.995 ? "none" : "blur(" + (blurMax * (1 - s)).toFixed(2) + "px)";
            els[i].style.opacity = (0.32 + 0.68 * s).toFixed(3);
            els[i].style.transform = "scale(" + (1 + 0.14 * s).toFixed(4) + ")";
            els[i].style.color = s > 0.5 ? accent : ink;
            els[i].style.textShadow = s > 0.5 ? "0 0 " + (30 * s).toFixed(0) + "px " + accent + "55" : "none";
          }
        }
        var st = {};
        Object.defineProperty(st, "t", { get: function () { return _t; }, set: function (v) { draw(v); } });

        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-focus-cycle-portrait"] = tl;
        draw(0);
        tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: introDur, ease: "power2.out" }, 0);
        tl.to(st, { t: DUR, duration: DUR, ease: "none" }, 0);       // 线性铺满,draw 内周期函数保证 N·step 无缝
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
      })();
    </script>
  </body>
</html>
