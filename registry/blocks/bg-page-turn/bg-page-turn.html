<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"srcs","type":"string","label":"Pages","description":"2-3 page images separated by \";\" (URL or project asset path), revealed in order","default":"assets/bgpt-page-1.svg;assets/bgpt-page-2.svg;assets/bgpt-page-3.svg","maxLength":900},
    {"id":"turn_dur","type":"number","label":"Turn duration","description":"Seconds of each line sweep (0.5-6)","default":1.6,"min":0.5,"max":6,"step":0.1},
    {"id":"dwell","type":"number","label":"Dwell","description":"Rest seconds between sweeps (0-5)","default":0.8,"min":0,"max":5,"step":0.1},
    {"id":"direction","type":"enum","label":"Direction","description":"Sweep origin: auto = landscape left-to-right / portrait top-to-bottom","default":"auto","options":[{"value":"auto","label":"Auto"},{"value":"ltr","label":"Landscape L→R / Portrait T→B"},{"value":"rtl","label":"Landscape R→L / Portrait B→T"}]},
    {"id":"scrim","type":"number","label":"Scrim","description":"Black overlay strength for text readability 0-1","default":0.35,"min":0,"max":1,"step":0.05},
    {"id":"dim","type":"number","label":"Dim","description":"De-bright / de-saturate 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"bg","type":"color","label":"Background","description":"Base color shown before intro","default":"#000000"},
    {"id":"intro","type":"number","label":"Intro","description":"Fade-in seconds","default":0.6,"min":0,"max":3,"step":0.1},
    {"id":"scene_dur","type":"number","label":"Scene duration","description":"Plan to cut around this length; sweeps span it (5-60), remainder holds the last page","default":15,"min":5,"max":60,"step":1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>bg-page-turn</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      #bgpt-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #bgpt-bg { position: absolute; inset: 0; z-index: 0; background: #000; }
      #bgpt-wrap { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; }
      .bgpt-page { position: absolute; inset: 0; background-repeat: no-repeat; will-change: clip-path; }
      #bgpt-scrim { position: absolute; inset: 0; z-index: 2; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bgpt-root"
      data-composition-id="bg-page-turn"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="bgpt-bg"></div>
      <div id="bgpt-wrap"></div>
      <div id="bgpt-scrim"></div>
      <div id="bgpt-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;   // manifest 上限;扫页序列按 scene_dur 铺,剩余停驻末页

        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var turnDur = clamp(V.turn_dur, 0.5, 6, 1.6);
        var dwell = clamp(V.dwell, 0, 5, 0.8);
        var dir = V.direction || "auto";
        var scrim = clamp(V.scrim, 0, 1, 0.35);
        var dim = clamp(V.dim, 0, 1, 0);
        var bg = V.bg || "#000";
        var introDur = clamp(V.intro, 0, 3, 0.6);
        var sceneDur = clamp(V.scene_dur, 5, DUR, 15);

        // 页面清单:2-3 张;空/畸形回退三张占位
        var DEFAULTS = ["assets/bgpt-page-1.svg", "assets/bgpt-page-2.svg", "assets/bgpt-page-3.svg"];
        var pages = String(V.srcs || "").split(";").map(function (s) { return s.trim(); }).filter(Boolean);
        if (!pages.length) pages = DEFAULTS.slice();
        if (pages.length > 3) pages = pages.slice(0, 3);
        var K = pages.length;

        var root = document.getElementById("bgpt-root");
        var bgEl = document.getElementById("bgpt-bg");
        var wrap = document.getElementById("bgpt-wrap");
        var scrimEl = document.getElementById("bgpt-scrim");
        bgEl.style.background = bg;
        if (dim > 0) wrap.style.filter = "brightness(" + (1 - 0.45 * dim) + ") saturate(" + (1 - 0.6 * dim) + ")";

        var w = root.clientWidth || 1920, h = root.clientHeight || 1080;
        var portrait = h > w;

        // 扫线方向:横屏 auto/ltr=左→右、rtl=右→左;竖屏 auto/ltr=上→下、rtl=下→上
        var sweepLR = !portrait ? dir !== "rtl" : false;
        var sweepRL = !portrait && dir === "rtl";
        var sweepTB = portrait && dir !== "rtl";
        var sweepBT = portrait && dir === "rtl";

        var tl = gsap.timeline({ paused: true });
        window.__timelines["bg-page-turn"] = tl;

        // ---- 页面层:整图 cover 铺满,自上而下叠放(第 1 张最上) ----
        var pageEls = [];
        for (var k = 0; k < K; k++) {
          var el = document.createElement("div");
          el.className = "bgpt-page";
          el.style.zIndex = String(20 - k);
          el.style.backgroundImage = "url(" + pages[k] + ")";
          el.style.backgroundSize = "cover";
          el.style.backgroundPosition = "center";
          wrap.appendChild(el);
          pageEls.push(el);
        }

        // 自定义素材加载失败 → 回退占位变体(仅换背景图,不影响时间轴)
        for (var k2 = 0; k2 < K; k2++) {
          (function (k) {
            var im = new Image();
            im.onerror = function () {
              if (String(im.src).indexOf("bgpt-page-") < 0) pageEls[k].style.backgroundImage = "url(" + DEFAULTS[k % 3] + ")";
            };
            im.src = pages[k];
          })(k2);
        }

        // ---- 线条扫过硬切:不可见逻辑线扫过,线后旧页被硬切掉露出新页 ----
        // 沿扫向裁掉旧页已扫过区域(clip-path inset),边界即扫线,无背部效果、无线条渲染
        function draw(k, u) {
          if (sweepLR) pageEls[k].style.clipPath = "inset(0px 0px 0px " + (w * u).toFixed(2) + "px)";
          else if (sweepRL) pageEls[k].style.clipPath = "inset(0px " + (w * u).toFixed(2) + "px 0px 0px)";
          else if (sweepTB) pageEls[k].style.clipPath = "inset(" + (h * u).toFixed(2) + "px 0px 0px 0px)";
          else pageEls[k].style.clipPath = "inset(0px 0px " + (h * u).toFixed(2) + "px 0px)";
        }
        var states = [];
        for (var k3 = 0; k3 < K; k3++) {
          (function (k) {
            var s = { _u: 0 };
            Object.defineProperty(s, "u", {
              get: function () { return s._u; },
              set: function (v) { s._u = v; draw(k, v); }
            });
            states.push(s);
            draw(k, 0);
          })(k3);
        }

        // ---- 序列:入场 → (停驻→扫页)×(K−1) → 停驻末页;铺不满 scene_dur 则比例压缩(保底节拍) ----
        var turns = K - 1;
        if (turns > 0) {
          var req = introDur + turns * turnDur + (turns + 1) * dwell;
          if (req > sceneDur) {
            var f = (sceneDur - introDur) / (turns * turnDur + (turns + 1) * dwell);
            turnDur = Math.max(0.5, turnDur * f);
            dwell = Math.max(0.2, dwell * f);
          }
          var t0 = introDur + dwell;
          for (var q = 0; q < turns; q++) {
            tl.to(states[q], { u: 1, duration: turnDur, ease: "power2.inOut" }, t0 + q * (turnDur + dwell));
          }
        }
        tl.to(wrap, { opacity: 1, duration: introDur, ease: "power2.out" }, 0);
        tl.to(scrimEl, { opacity: scrim, duration: introDur, ease: "power2.out" }, 0);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);                // 静止铺满上限,宿主任意裁剪
      })();
    </script>
  </body>
</html>
