<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Lines","description":"Lines separated by \\n, revealed top to bottom; *word* = emphasized (accent color)","default":"三个信号同时出现\\n*拐点*得到确认\\n仓位管理是核心","maxLength":400},
    {"id":"interval","type":"number","label":"Interval","description":"Stagger between lines in seconds (0.1-0.8)","default":0.3,"min":0.1,"max":0.8,"step":0.02},
    {"id":"duration","type":"number","label":"Duration","description":"Line reveal seconds (0.4-1.5)","default":0.7,"min":0.4,"max":1.5,"step":0.05},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (24-140)","default":68,"min":24,"max":140,"step":2},
    {"id":"align","type":"enum","label":"Align","description":"Line alignment","default":"center","options":[{"value":"center","label":"Center"},{"value":"left","label":"Left"},{"value":"right","label":"Right"}]},
    {"id":"color","type":"color","label":"Ink","description":"Text color","default":"#f1f5f9"},
    {"id":"accent","type":"color","label":"Accent","description":"Emphasized (*marked*) word color","default":"#f472b6"},
    {"id":"intro","type":"number","label":"Delay","description":"Seconds before the first line reveals (0-2)","default":0.2,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-line-cascade</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tlc-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #tlc-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8%; }
      #tlc-body { max-width: 100%; font-weight: 700; line-height: 1.55;
        font-family: "Noto Sans SC", sans-serif; }
      .tlc-w { display: block; overflow: hidden; padding-bottom: 0.08em; }   /* 行掩膜窗口 */
      .tlc-u { display: inline-block; will-change: transform; white-space: pre-wrap; } /* 行滑片 */
      .tlc-em { color: #f472b6; }
    </style>
  </head>
  <body>
    <div id="tlc-root"
      data-composition-id="text-line-cascade"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="tlc-box"><div id="tlc-body"></div></div>
      <div id="tlc-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var interval = clamp(V.interval, 0.1, 0.8, 0.3);
        var dur = clamp(V.duration, 0.4, 1.5, 0.7);
        var fontSize = clamp(V.font_size, 24, 140, 68);
        var align = ["center", "left", "right"].indexOf(V.align) >= 0 ? V.align : "center";
        var ink = V.color || "#f1f5f9";
        var accent = V.accent || "#f472b6";
        var delay0 = clamp(V.intro, 0, 2, 0.2);

        var body = document.getElementById("tlc-body");
        body.style.fontSize = fontSize + "px";
        body.style.color = ink;
        body.style.textAlign = align;

        // 行级瀑布:整行在自身掩膜窗口内从下滑入(窗外不可见),自上而下错峰
        var lines = [];
        String(V.text == null ? "" : V.text).split(/\\n|\n/).filter(function (l, i, a) { return l !== "" || i < a.length - 1; }).forEach(function (line) {
          var w = document.createElement("span");
          w.className = "tlc-w";
          var el = document.createElement("span");
          el.className = "tlc-u";
          var re = /\*([^*]+)\*/g, last = 0, m;
          while ((m = re.exec(line))) {
            if (m.index > last) el.appendChild(document.createTextNode(line.slice(last, m.index)));
            var em = document.createElement("span");
            em.className = "tlc-em";
            em.style.color = accent;
            em.textContent = m[1];
            el.appendChild(em);
            last = m.index + m[0].length;
          }
          if (last < line.length) el.appendChild(document.createTextNode(line.slice(last)));
          if (!el.childNodes.length) el.textContent = line;
          w.appendChild(el);
          body.appendChild(w);
          lines.push(el);
        });

        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-line-cascade"] = tl;
        lines.forEach(function (el, i) {
          tl.fromTo(el, { y: fontSize * 1.25 }, { y: 0, duration: dur, ease: "power3.out" }, delay0 + i * interval);
        });
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
      })();
    </script>
  </body>
</html>
