<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"color","type":"color","label":"Stream color","description":"Trail character color","default":"#00ffcc"},
    {"id":"density","type":"number","label":"Density","description":"Max column count (8-240)","default":90,"min":8,"max":240,"step":4},
    {"id":"speed","type":"number","label":"Speed","description":"Fall speed feel (20-400)","default":100,"min":20,"max":400,"step":10},
    {"id":"charset","type":"enum","label":"Charset","description":"hex / digits / binary / katakana / en / zh / ja (phrase rain)","default":"hex","options":[{"value":"hex","label":"Hex"},{"value":"digits","label":"Digits"},{"value":"binary","label":"Binary"},{"value":"katakana","label":"Katakana"},{"value":"en","label":"English phrases"},{"value":"zh","label":"Chinese phrases"},{"value":"ja","label":"Japanese phrases"}]},
    {"id":"intensity","type":"number","label":"Intensity","description":"Trail brightness 0-1","default":0.82,"min":0,"max":1,"step":0.05},
    {"id":"direction","type":"enum","label":"Direction","description":"Fall direction","default":"down","options":[{"value":"down","label":"Down"},{"value":"up","label":"Up"}]},
    {"id":"bg","type":"color","label":"Background","description":"Canvas base color","default":"#05060d"},
    {"id":"scrim","type":"number","label":"Scrim","description":"Black overlay strength for text readability 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"dim","type":"number","label":"Dim","description":"De-bright / de-saturate 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"intro","type":"number","label":"Intro","description":"Fade-in seconds","default":0.6,"min":0,"max":3,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>bg-data-stream</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #05060d; overflow: hidden; }
      #bgs-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05060d; }
      #bgs-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
      #bgs-scrim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bgs-root"
      data-composition-id="bg-data-stream"
      data-start="0"
      data-duration="64"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="bgs-canvas"></canvas>
      <div id="bgs-scrim"></div>
      <div id="bgs-drv" class="clip" data-start="0" data-duration="64" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        // ---- 短语库(与 bg-matrix 同源;确定性 hash 挑选 → seamless + seek 一致) ----
        var PHRASES = {
          en: ["Have a wonderful day","Keep moving forward always","Wishing you all the best","You can do anything","Never give up on yourself","Believe in your dreams","Stay strong and positive","Make today absolutely amazing","You are truly enough","Chase your wildest dreams","Shine bright like the sun","Be kind to everyone","Every moment truly matters","Follow your heart always","Dream big work hard","You matter so much","Good things are coming","Spread love everywhere today","Keep your head high","Smile through the pain","You inspire many people","Trust the timing always","Breathe deeply and relax","Embrace every new day","Send good vibes outward","Love yourself completely now","Push beyond your limits","Find joy in everything","Create your own happiness","Hope fuels the journey","Rise above every challenge","You will overcome this","Stay curious keep learning","Light always finds a way","Walk your own path"],
          zh: ["祝你每天都开心快乐","愿你心想事成万事如意","我们一起努力向前冲","保持热爱奔赴山海","愿你前程似锦未来可期","星光不问赶路的人","你要相信你自己一定行","生活的美好值得期待","勇敢做自己闪闪发光","愿所有的美好如期而至","心中有光脚下有路","微笑面对每一天的阳光","你是最棒的要永远记得","愿你被世界温柔以待","努力奋斗终将收获成功","把每一天都过得精彩","愿你眼里有光心中有爱","不负韶华只争朝夕","你的努力终会被看见","愿你历尽千帆归来仍是少年","保持善良保持热爱","一切都会好起来的相信我","愿你三冬暖愿你春不寒","你值得拥有世间美好","心之所向素履以往","愿你余生皆是从容","把握当下珍惜眼前人","你是我生命中的光","愿你历尽沧桑依然善良","永远相信美好的事情","坚持就是胜利加油","愿你一生平安喜乐安康","向着光亮那方前行","你只管努力剩下的交给时间","愿你的眼里永远有光"],
          ja: ["ありがとうございました","おはようございます","がんばってください","こんにちは皆さん","素晴らしい一日を","いつも応援しています","幸せな毎日を過ごして","心から感謝します","諦めずに頑張ろう","夢は必ず叶うから","あなたは最高ですよ","明日もいい一日を","一緒に頑張りましょう","永遠に愛しています","信じて進み続けよう","優しさを忘れないで","希望の光を信じて","笑顔で乗り越えよう","健康で幸せに暮らそう","絆は永遠に続きます","光に向かって歩こう","感謝の気持ちを込めて","勇気を出して一歩前へ","未来は明るいですよ","絶対に諦めないで","輝く未来を信じてる","毎日少しずつ成長する","大好きな人を大切に","平和な世界を願って","命の輝きを感じて","幸せはすぐそばにある","心を込めて愛を込めて","涙の分だけ強くなる","ありがとういつも","頑張れ必ず道はある"]
        };
        var CHARSETS = {
          binary: "01",
          hex: "0123456789ABCDEF",
          digits: "0123456789",
          katakana: "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ"
        };

        var DUR = 64;          // manifest duration = 8 × LOOP_CYCLE
        var LOOP_CYCLE = 8;

        function hash01(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var color = V.color || "#00ffcc";
        var density = clamp(V.density, 8, 300, 200);
        var speed = clamp(V.speed, 20, 400, 100);
        var charset = V.charset || "hex";
        var intensity = clamp(V.intensity, 0, 1, 0.82);
        var dir = V.direction === "up" ? -1 : 1;
        var bg = V.bg || "#05060d";
        var scrim = clamp(V.scrim, 0, 1, 0);
        var dim = clamp(V.dim, 0, 1, 0);
        var introDur = clamp(V.intro, 0, 3, 0.6);
        var baseFreq = Math.max(1, Math.min(6, Math.round(speed / 50)));

        var root = document.getElementById("bgs-root");
        var canvas = document.getElementById("bgs-canvas");
        var scrimEl = document.getElementById("bgs-scrim");
        var w = root.clientWidth || 1920, h = root.clientHeight || 1080;
        canvas.width = w; canvas.height = h;
        if (dim > 0) canvas.style.filter = "brightness(" + (1 - 0.45 * dim) + ") saturate(" + (1 - 0.6 * dim) + ")";
        var ctx = canvas.getContext("2d");

        function colChars(i) {
          if (PHRASES[charset]) {
            var lib = PHRASES[charset];
            return lib[Math.floor(hash01(i * 9 + 3) * lib.length) % lib.length].split("");
          }
          var chars = CHARSETS[charset] || CHARSETS.hex;
          var n = 7 + Math.floor(hash01(i * 23 + 5) * 14), arr = [];
          for (var k = 0; k < n; k++) arr.push(chars[Math.floor(hash01(i * 31 + k * 7) * chars.length) % chars.length]);
          return arr;
        }

        var fontSize = 22;    // 块状字,与 bg-matrix 同族观感(列宽=字宽)
        var lineH = Math.round(fontSize * 1.4);
        var colWidth = Math.max(fontSize, Math.round(w / density));
        var actualCols = Math.min(density, Math.floor(w / colWidth));
        var cols = [];
        for (var i = 0; i < actualCols; i++) {
          var chars = colChars(i);
          cols.push({
            x: i * colWidth + colWidth * 0.5 + (hash01(i * 5 + 7) - 0.5) * colWidth * 0.35,
            freq: 1 + Math.floor(hash01(i * 13 + 2) * (baseFreq + 1)),
            off: hash01(i * 17 + 3),
            chars: chars,
            span: h + (chars.length + 1) * lineH
          });
        }

        // 纯函数 draw:亮度尾迹同 bg-matrix(head 最亮 → 前 5 字依次暗 → 第 5 字起恒定);周期相位 → seamless
        function draw(t, a) {
          ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
          ctx.font = fontSize + "px monospace"; ctx.textBaseline = "top"; ctx.textAlign = "center";
          var ph = t / LOOP_CYCLE;
          for (var ci = 0; ci < cols.length; ci++) {
            var c = cols[ci];
            var prog = (ph * c.freq + c.off) % 1; if (prog < 0) prog += 1;
            var travel = prog * c.span;
            var headY = dir > 0 ? -fontSize + travel : h + fontSize + c.chars.length * lineH - travel;
            var n = c.chars.length;
            for (var k = 0; k < n; k++) {
              var y = headY - dir * k * lineH;
              if (y < -fontSize || y > h + fontSize) continue;
              var base = k === 0 ? Math.min(1, intensity + 0.35) : (k < 5 ? 0.85 - 0.1 * k : 0.45) * intensity;
              if (base < 0.05) continue;
              ctx.globalAlpha = base * a;
              ctx.fillStyle = k === 0 ? "#d6fff6" : color;
              ctx.fillText(c.chars[k], c.x, y);
            }
          }
          ctx.globalAlpha = 1;
        }

        var _st = { _t: 0, _a: 0 };
        Object.defineProperty(_st, "t", { configurable: true, get: function () { return _st._t; }, set: function (v) { _st._t = v; draw(_st._t, _st._a); } });
        Object.defineProperty(_st, "a", { configurable: true, get: function () { return _st._a; }, set: function (v) { _st._a = v; draw(_st._t, _st._a); } });

        var tl = gsap.timeline({ paused: true });
        tl.to(_st, { t: DUR, duration: DUR, ease: "none" }, 0);
        tl.to(_st, { a: 1, duration: introDur, ease: "power2.out" }, 0);
        tl.to(scrimEl, { opacity: scrim, duration: introDur, ease: "power2.out" }, 0);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
        draw(0, 0);
        window.__timelines["bg-data-stream"] = tl;
      })();
    </script>
  </body>
</html>
