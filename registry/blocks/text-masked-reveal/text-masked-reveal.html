<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Text","description":"Text; \\n = line break; *word* = emphasized (accent color)","default":"算法重构 *全链路* 提效","maxLength":400},
    {"id":"unit","type":"enum","label":"Unit","description":"Reveal unit: CJK word or character","default":"word","options":[{"value":"word","label":"Word (CJK-segmented)"},{"value":"char","label":"Character"}]},
    {"id":"direction","type":"enum","label":"Direction","description":"Sweep direction of the clip reveal","default":"left","options":[{"value":"left","label":"Sweep left-to-right"},{"value":"right","label":"Sweep right-to-left"}]},
    {"id":"interval","type":"number","label":"Interval","description":"Stagger between units in seconds (0.02-0.3)","default":0.09,"min":0.02,"max":0.3,"step":0.01},
    {"id":"duration","type":"number","label":"Duration","description":"Unit reveal seconds (0.3-1.2)","default":0.5,"min":0.3,"max":1.2,"step":0.05},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (24-200)","default":84,"min":24,"max":200,"step":2},
    {"id":"color","type":"color","label":"Ink","description":"Text color","default":"#f1f5f9"},
    {"id":"accent","type":"color","label":"Accent","description":"Emphasized (*marked*) unit color","default":"#38bdf8"},
    {"id":"intro","type":"number","label":"Delay","description":"Seconds before the first unit reveals (0-2)","default":0.2,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-masked-reveal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tmr-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #tmr-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8%; }
      #tmr-body { max-width: 100%; text-align: center; font-weight: 700; line-height: 1.32;
        font-family: "Noto Sans SC", sans-serif; }
      .tmr-line { display: block; }
      .tmr-w { position: relative; display: inline-block; overflow: hidden; vertical-align: bottom; }   /* 掩膜窗口 */
      .tmr-u { position: relative; display: inline-block; will-change: transform; white-space: pre; }  /* 窗内滑片 */
    </style>
  </head>
  <body>
    <div id="tmr-root"
      data-composition-id="text-masked-reveal"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="tmr-box"><div id="tmr-body"></div></div>
      <div id="tmr-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var unit = V.unit === "char" ? "char" : "word";
        var dirR = V.direction === "right";
        var interval = clamp(V.interval, 0.02, 0.3, 0.09);
        var dur = clamp(V.duration, 0.3, 1.2, 0.5);
        var fontSize = clamp(V.font_size, 24, 200, 84);
        var ink = V.color || "#f1f5f9";
        var accent = V.accent || "#38bdf8";
        var delay0 = clamp(V.intro, 0, 2, 0.2);

        var body = document.getElementById("tmr-body");
        body.style.fontSize = fontSize + "px";
        body.style.color = ink;

        // CJK 分词核心(*强调* → runs → Segmenter word 级/char 级;尾随空白并入前单元)
        function parseLine(line) {
          var units = [], re = /\*([^*]+)\*/g, last = 0, m;
          function push(t, emph) {
            if (!t) return;
            if (/^\s+$/.test(t) && units.length) { units[units.length - 1].text += t; return; }
            units.push({ text: t, emph: emph });
          }
          function segment(str, emph) {
            if (unit === "char" || !(typeof Intl !== "undefined" && Intl.Segmenter))
              Array.from(str).forEach(function (ch) { push(ch, emph); });
            else
              Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(str)).forEach(function (s) { push(s.segment, emph); });
          }
          while ((m = re.exec(line))) {
            if (m.index > last) segment(line.slice(last, m.index), false);
            segment(m[1], true);
            last = m.index + m[0].length;
          }
          if (last < line.length) segment(line.slice(last), false);
          return units;
        }

        var inners = [];
        String(V.text == null ? "" : V.text).split(/\\n|\n/).forEach(function (line) {
          if (line === "" && inners.length) { body.appendChild(document.createElement("br")); return; }
          var div = document.createElement("span");
          div.className = "tmr-line";
          parseLine(line).forEach(function (u) {
            var w = document.createElement("span");
            w.className = "tmr-w";                            // 掩膜:overflow hidden 窗口(= 词占位)
            var el = document.createElement("span");
            el.className = "tmr-u";
            el.textContent = u.text;
            if (u.emph) { el.style.color = accent; el.style.textShadow = "0 0 22px " + accent + "55"; }
            w.appendChild(el);
            div.appendChild(w);
            inners.push(el);
          });
          body.appendChild(div);
        });

        // 掩膜扫出:文字单元在自身窗口内滑入(窗外不可见),错峰扫过——干净揭示,无飞行
        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-masked-reveal"] = tl;
        var off = fontSize * 1.15;
        inners.forEach(function (el, i) {
          var x0 = dirR ? -off : off;                         // 右扫:片从左进来;左扫:从右
          tl.fromTo(el, { x: dirR ? -off : off },
            { x: 0, duration: dur, ease: "power3.out" }, delay0 + i * interval);
        });
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
      })();
    </script>
  </body>
</html>
