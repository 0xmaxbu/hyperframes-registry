<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Word","description":"The word/phrase to stack (no line breaks)","default":"护城河","maxLength":60},
    {"id":"echoes","type":"number","label":"Echoes","description":"Echo copies behind the main word (2-8)","default":4,"min":2,"max":8,"step":1},
    {"id":"spread","type":"number","label":"Spread","description":"Diagonal offset between copies in px (8-60)","default":22,"min":8,"max":60,"step":2},
    {"id":"interval","type":"number","label":"Interval","description":"Stagger between copies in seconds (0.05-0.4)","default":0.12,"min":0.05,"max":0.4,"step":0.01},
    {"id":"duration","type":"number","label":"Duration","description":"Each copy entrance seconds (0.3-1)","default":0.45,"min":0.3,"max":1,"step":0.05},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (40-260)","default":140,"min":40,"max":260,"step":2},
    {"id":"color","type":"color","label":"Ink","description":"Echo copies color","default":"#38bdf8"},
    {"id":"accent","type":"color","label":"Accent","description":"Main (front) word color","default":"#fbbf24"},
    {"id":"intro","type":"number","label":"Delay","description":"Seconds before the first echo drops (0-2)","default":0.2,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-word-echo-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #twe-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #twe-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .twe-c { position: absolute; font-weight: 800; white-space: nowrap; will-change: transform, opacity;
        font-family: "Noto Sans SC", sans-serif; }
    </style>
  </head>
  <body>
    <div id="twe-root"
      data-composition-id="text-word-echo-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="twe-box"></div>
      <div id="twe-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var echoes = Math.round(clamp(V.echoes, 2, 8, 4));
        var spread = clamp(V.spread, 8, 60, 22);
        var interval = clamp(V.interval, 0.05, 0.4, 0.12);
        var dur = clamp(V.duration, 0.3, 1, 0.45);
        var fontSize = clamp(V.font_size, 40, 260, 140);
        var ink = V.color || "#38bdf8";
        var accent = V.accent || "#fbbf24";
        var delay0 = clamp(V.intro, 0, 2, 0.2);

        var box = document.getElementById("twe-box");
        var word = String(V.text == null ? "护城河" : V.text).trim() || "护城河";

        // 同词重复堆叠:echo 副本沿对角递减错位(后=更暗更远),主词最后压轴落定
        var els = [];
        for (var k = 0; k < echoes; k++) {
          var el = document.createElement("div");
          el.className = "twe-c";
          el.textContent = word;
          el.style.fontSize = fontSize + "px";
          el.style.color = ink;
          el.style.left = "calc(50% + " + (k * spread) + "px)";
          el.style.top = "calc(50% + " + (k * spread * 0.75 - fontSize * 0.5) + "px)";
          el.style.transform = "translate(-50%, 0)";
          el.setAttribute("data-op", String(0.85 / (k + 1)));
          box.appendChild(el);
          els.push(el);
        }
        var main = document.createElement("div");
        main.className = "twe-c";
        main.textContent = word;
        main.style.fontSize = fontSize + "px";
        main.style.color = accent;
        main.style.left = "50%";
        main.style.top = "calc(50% - " + (fontSize * 0.5) + "px)";
        main.style.transform = "translate(-50%, 0)";
        main.style.textShadow = "0 0 40px " + accent + "66";
        box.appendChild(main);

        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-word-echo-portrait"] = tl;
        els.forEach(function (el, k) {                    // echo 依次从上落下(power2.in 有重量感)
          tl.fromTo(el,
            { y: -(fontSize * 1.6 + k * 40), opacity: 0 },
            { y: 0, opacity: Number(el.getAttribute("data-op")), duration: dur, ease: "power2.in" },
            delay0 + k * interval);
        });
        tl.fromTo(main,                                   // 主词压轴:弹入 + 短暂回弹
          { scale: 2.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: Math.max(0.4, dur * 1.1), ease: "back.out(1.8)" },
          delay0 + els.length * interval);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
      })();
    </script>
  </body>
</html>
