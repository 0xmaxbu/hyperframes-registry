<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"colors","type":"string","label":"Colors","description":"Comma-separated hex list, e.g. #3b82f6,#8b5cf6,#db2777","default":"#3b82f6,#8b5cf6,#db2777,#f59e0b","maxLength":200},
    {"id":"density","type":"number","label":"Density","description":"Blob count (3-9)","default":6,"min":3,"max":9,"step":1},
    {"id":"speed","type":"number","label":"Speed","description":"Drift speed feel (10-200)","default":50,"min":10,"max":200,"step":10},
    {"id":"intensity","type":"number","label":"Intensity","description":"Blob deformation 0-1","default":0.6,"min":0,"max":1,"step":0.05},
    {"id":"base","type":"enum","label":"Base","description":"Light or dark canvas base","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]},
    {"id":"bg","type":"color","label":"Background","description":"Canvas base color (default follows base)","default":""},
    {"id":"scrim","type":"number","label":"Scrim","description":"Black overlay strength for text readability 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"dim","type":"number","label":"Dim","description":"De-bright / de-saturate 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"intro","type":"number","label":"Intro","description":"Fade-in seconds","default":0.6,"min":0,"max":3,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>bg-aurora</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #ffffff; overflow: hidden; }
      #bga-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #bga-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
      #bga-scrim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bga-root"
      data-composition-id="bg-aurora"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="bga-canvas"></canvas>
      <div id="bga-scrim"></div>
      <div id="bga-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;          // manifest duration = 6 × LOOP_CYCLE
        var LOOP_CYCLE = 10;

        function hash01(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var colors = String(V.colors || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        if (!colors.length) colors = ["#3b82f6", "#8b5cf6", "#db2777", "#f59e0b"];
        var density = clamp(V.density, 3, 9, 6);
        var speed = clamp(V.speed, 10, 200, 50);
        var intensity = clamp(V.intensity, 0, 1, 0.6);
        var dark = V.base === "dark";
        var bg = V.bg || (dark ? "#0a0a12" : "#ffffff");
        var scrim = clamp(V.scrim, 0, 1, 0);
        var dim = clamp(V.dim, 0, 1, 0);
        var introDur = clamp(V.intro, 0, 3, 0.6);
        var freq = Math.max(1, Math.min(4, Math.round(speed / 50)));

        var root = document.getElementById("bga-root");
        var canvas = document.getElementById("bga-canvas");
        var scrimEl = document.getElementById("bga-scrim");
        var w = root.clientWidth || 1920, h = root.clientHeight || 1080;
        canvas.width = w; canvas.height = h;
        if (dim > 0) canvas.style.filter = "brightness(" + (1 - 0.45 * dim) + ") saturate(" + (1 - 0.6 * dim) + ")";
        var ctx = canvas.getContext("2d");

        // 交错覆盖中心表(中→四角→四边),density 取前 N 个保证均匀铺满
        var CENTERS = [[0.5, 0.5], [0.18, 0.24], [0.82, 0.78], [0.82, 0.22], [0.18, 0.8], [0.5, 0.12], [0.5, 0.88], [0.12, 0.5], [0.88, 0.5]];
        var N = 24;

        var blobs = [];
        for (var i = 0; i < density; i++) {
          // 每组谐波独立:方向 ±、整数倍频 vf、振幅脉动 gf —— 混向混频 → 轮廓不规则变形而非整体旋转
          // 振幅按谐波阶数递减(Σ≤0.54 → rr 恒正),加大到肉眼明显的"变形虫"程度
          var AMP = [0, 0.16, 0.12, 0.09, 0.06];
          var harm = [];
          for (var m = 1; m <= 4; m++) harm.push({
            a: AMP[m] * (0.75 + 0.5 * hash01(i * 11 + m * 3)) * intensity, w: m,
            psi: hash01(i * 17 + m * 7) * Math.PI * 2,
            dir: hash01(i * 29 + m * 5) < 0.5 ? -1 : 1,
            vf: 1 + Math.floor(hash01(i * 37 + m * 11) * 3),
            gf: 1 + Math.floor(hash01(i * 43 + m * 17) * 2),
            pf: hash01(i * 41 + m * 13) * Math.PI * 2
          });
          var c = CENTERS[i % CENTERS.length];
          blobs.push({
            bx: c[0] + (hash01(i * 71 + 1) - 0.5) * 0.12, by: c[1] + (hash01(i * 73 + 2) - 0.5) * 0.12,
            ax: 0.03 + 0.03 * hash01(i * 7 + 3), ay: 0.03 + 0.03 * hash01(i * 9 + 4),
            px: hash01(i * 13 + 1) * Math.PI * 2, py: hash01(i * 19 + 2) * Math.PI * 2,
            px2: hash01(i * 13 + 11) * Math.PI * 2, py2: hash01(i * 19 + 12) * Math.PI * 2,
            dk: 1 + (i % 2), dp: hash01(i * 47 + 2) * Math.PI * 2,          // 深度键频率/相位(整倍频 → 无缝)
            R: 0.45 + 0.17 * hash01(i * 23 + 5), harm: harm, color: colors[i % colors.length]
          });
        }

        function traceBlob(b, cx, cy, R, ph) {
          var pts = [];
          for (var k = 0; k < N; k++) {
            var th = 2 * Math.PI * k / N, rr = 1;
            for (var hi = 0; hi < b.harm.length; hi++) {
              var hm = b.harm[hi];
              var amp = hm.a * (0.7 + 0.3 * Math.sin(2 * Math.PI * hm.gf * ph + hm.pf));   // 振幅脉动 → 呼吸式变形
              rr += amp * Math.sin(hm.w * th + hm.dir * 2 * Math.PI * hm.vf * ph + hm.psi);
            }
            pts.push([cx + Math.cos(th) * R * rr, cy + Math.sin(th) * R * rr]);
          }
          function mid(a, c) { return [(a[0] + c[0]) / 2, (a[1] + c[1]) / 2]; }
          ctx.beginPath();
          var m0 = mid(pts[N - 1], pts[0]); ctx.moveTo(m0[0], m0[1]);
          for (var k2 = 0; k2 < N; k2++) { var nxt = pts[(k2 + 1) % N]; var mm = mid(pts[k2], nxt); ctx.quadraticCurveTo(pts[k2][0], pts[k2][1], mm[0], mm[1]); }
          ctx.closePath();
        }

        // 纯函数 draw:极坐标谐波扰动闭合路径 + 中心全 sin 周期 → seamless
        function draw(t, a) {
          var ph = t / LOOP_CYCLE;
          ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
          var R0 = Math.min(w, h);
          // 动态叠压:按深度键排序绘制(键大的后画 = 在上层)→ 色块轮流被遮挡,无永久顶层
          var order = [];
          for (var oi = 0; oi < density; oi++) order.push(oi);
          order.sort(function (a, b) { return Math.sin(2 * Math.PI * blobs[b].dk * ph + blobs[b].dp) - Math.sin(2 * Math.PI * blobs[a].dk * ph + blobs[a].dp); });
          for (var si = 0; si < order.length; si++) {
            var i = order[si];
            var b = blobs[i];
            // 中心漂移双谐波(基频+2×,不同相位)→ 不规则路径,非规则圆轨道;R 呼吸脉动(整数倍频,无缝)
            var cx = (b.bx + b.ax * Math.sin(2 * Math.PI * freq * ph + b.px) + 0.4 * b.ax * Math.sin(2 * Math.PI * (freq + 2) * ph + b.px2)) * w;
            var cy = (b.by + b.ay * Math.sin(2 * Math.PI * freq * ph + b.py) + 0.4 * b.ay * Math.sin(2 * Math.PI * (freq + 2) * ph + b.py2)) * h;
            var Rt = b.R * (1 + 0.12 * Math.sin(2 * Math.PI * (1 + i % 3) * ph + b.px2));
            traceBlob(b, cx, cy, Rt * R0, ph);
            ctx.globalAlpha = 0.95 * a; ctx.fillStyle = b.color; ctx.fill();
          }
          ctx.globalAlpha = 0.22 * a; ctx.strokeStyle = dark ? "#67e8f9" : "#f9a8d4"; ctx.lineWidth = 1.5;
          for (var L = 0; L < 3; L++) {
            ctx.beginPath();
            for (var s = 0; s <= 40; s++) {
              var u = s / 40, x = w * (0.45 + 0.5 * u);
              var y = h * (0.05 + 0.12 * L) + Math.sin(2 * Math.PI * (freq * ph + u * 2 + L * 0.4)) * 30;
              if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }

        var _st = { _t: 0, _a: 0 };
        Object.defineProperty(_st, "t", { configurable: true, get: function () { return _st._t; }, set: function (v) { _st._t = v; draw(_st._t, _st._a); } });
        Object.defineProperty(_st, "a", { configurable: true, get: function () { return _st._a; }, set: function (v) { _st._a = v; draw(_st._t, _st._a); } });

        var tl = gsap.timeline({ paused: true });
        tl.to(_st, { t: DUR, duration: DUR, ease: "none" }, 0);
        tl.to(_st, { a: 1, duration: introDur, ease: "power2.out" }, 0);
        tl.to(scrimEl, { opacity: scrim, duration: introDur, ease: "power2.out" }, 0);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
        draw(0, 0);
        window.__timelines["bg-aurora"] = tl;
      })();
    </script>
  </body>
</html>
