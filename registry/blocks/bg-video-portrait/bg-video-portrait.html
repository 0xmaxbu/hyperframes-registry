<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"src","type":"string","label":"Video","description":"Muted background video (URL or project asset path)","default":"assets/bg-video-placeholder.mp4","maxLength":300},
    {"id":"poster","type":"string","label":"Poster","description":"Poster image path (optional)","default":"","maxLength":300},
    {"id":"speed","type":"number","label":"Speed","description":"Playback rate (0.6-1)","default":1,"min":0.6,"max":1,"step":0.05},
    {"id":"play_from","type":"number","label":"Play from","description":"Source start offset in seconds","default":0,"min":0,"max":3600,"step":0.5},
    {"id":"move","type":"enum","label":"Camera move","description":"Ken-burns move over scene_dur","default":"push-in","options":[{"value":"push-in","label":"Push in"},{"value":"zoom-in","label":"Zoom in"},{"value":"pull-out","label":"Pull out"},{"value":"zoom-out","label":"Zoom out"},{"value":"pan-left","label":"Pan left"},{"value":"pan-right","label":"Pan right"},{"value":"pan-up","label":"Pan up"},{"value":"pan-down","label":"Pan down"},{"value":"none","label":"None"}]},
    {"id":"max_zoom","type":"number","label":"Max zoom","description":"Ken-burns zoom base (1-2); pans auto-raise up to 2.0 to keep minimum travel","default":1.12,"min":1,"max":2,"step":0.05},
    {"id":"focus_x","type":"number","label":"Focus X","description":"Transform origin X 0-1","default":0.5,"min":0,"max":1,"step":0.05},
    {"id":"focus_y","type":"number","label":"Focus Y","description":"Transform origin Y 0-1","default":0.5,"min":0,"max":1,"step":0.05},
    {"id":"scrim","type":"number","label":"Scrim","description":"Black overlay strength for text readability 0-1","default":0.35,"min":0,"max":1,"step":0.05},
    {"id":"dim","type":"number","label":"Dim","description":"De-bright / de-saturate 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"bg","type":"color","label":"Background","description":"Base color shown before intro","default":"#000000"},
    {"id":"intro","type":"number","label":"Intro","description":"Fade-in seconds","default":0.6,"min":0,"max":3,"step":0.1},
    {"id":"scene_dur","type":"number","label":"Scene duration","description":"Plan to cut around this length; the move spans it (5-60)","default":15,"min":5,"max":60,"step":1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>bg-video-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      #bgv-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #bgv-bg { position: absolute; inset: 0; z-index: 0; background: #000; }
      #bgv-wrap { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; will-change: transform; }
      #bgv-scrim { position: absolute; inset: 0; z-index: 2; background: #000; opacity: 0; pointer-events: none; }
      #bgv-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
  </head>
  <body>
    <div id="bgv-root"
      data-composition-id="bg-video-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="bgv-bg"></div>
      <!-- wrap 非计时(运镜动 wrap);计时在 video 元素上 —— 框架托管媒体,composition 代码不碰播放 -->
      <div id="bgv-wrap">
        <video id="bgv-video" class="clip" data-var-src="src" src="assets/bg-video-placeholder.mp4"
          data-start="0" data-duration="60" data-track-index="0"
          data-media-start="0" data-playback-rate="1"
          muted playsinline preload="auto"></video>
      </div>
      <div id="bgv-scrim"></div>
      <div id="bgv-drv" class="clip" data-start="0" data-duration="60" data-track-index="1"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;   // manifest 上限;一次性运镜按 scene_dur 铺满

        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var poster = String(V.poster || "");
        var speed = clamp(V.speed, 0.6, 1, 1);
        var playFrom = clamp(V.play_from, 0, 3600, 0);
        var maxZoom = clamp(V.max_zoom, 1, 2, 1.12);
        var fx = clamp(V.focus_x, 0, 1, 0.5), fy = clamp(V.focus_y, 0, 1, 0.5);
        var scrim = clamp(V.scrim, 0, 1, 0.35);
        var dim = clamp(V.dim, 0, 1, 0);
        var bg = V.bg || "#000";
        var introDur = clamp(V.intro, 0, 3, 0.6);
        var sceneDur = clamp(V.scene_dur, 5, DUR, 15);

        var MOVES = {
          "push-in":   { s0: 1, s1: "Z", x0: 0, y0: 0, x1: 0, y1: 0, ax: null },
          "zoom-in":   { s0: 1, s1: "Z", x0: 0, y0: 0, x1: 0, y1: 0, ax: null },
          "pull-out":  { s0: "Z", s1: 1, x0: 0, y0: 0, x1: 0, y1: 0, ax: null },
          "zoom-out":  { s0: "Z", s1: 1, x0: 0, y0: 0, x1: 0, y1: 0, ax: null },
          "pan-left":  { s0: "Z", s1: "Z", x0: "P", y0: 0, x1: "-P", y1: 0, ax: "x" },
          "pan-right": { s0: "Z", s1: "Z", x0: "-P", y0: 0, x1: "P", y1: 0, ax: "x" },
          "pan-up":    { s0: "Z", s1: "Z", x0: 0, y0: "P", x1: 0, y1: "-P", ax: "y" },
          "pan-down":  { s0: "Z", s1: "Z", x0: 0, y0: "-P", x1: 0, y1: "P", ax: "y" },
          "none":      { s0: 1, s1: 1, x0: 0, y0: 0, x1: 0, y1: 0, ax: null }
        };
        var mv = MOVES[V.move] || MOVES["push-in"];

        var root = document.getElementById("bgv-root");
        var bgEl = document.getElementById("bgv-bg");
        var wrap = document.getElementById("bgv-wrap");
        var video = document.getElementById("bgv-video");
        var scrimEl = document.getElementById("bgv-scrim");
        bgEl.style.background = bg;
        if (dim > 0) wrap.style.filter = "brightness(" + (1 - 0.45 * dim) + ") saturate(" + (1 - 0.6 * dim) + ")";

        // 变量 → 媒体属性:init 期改写 data-*(运行时在此之后解析媒体);播放仍全归框架。
        // data-duration 恒为 manifest 上限:scene_dur 只铺运镜;素材短于窗口则自然停末帧。
        if (poster) video.setAttribute("poster", poster);
        if (playFrom !== 0) video.setAttribute("data-media-start", String(playFrom));
        if (speed !== 1) video.setAttribute("data-playback-rate", String(speed));

        var w = root.clientWidth || 1920, h = root.clientHeight || 1080;

        // 运镜固定规则(同 bg-image,媒体感知):行程 = clamp(余量×0.8, 100px, 420px) 且 ≤ 余量×0.8(永不露边);
        // 余量不足自动抬 Z(≤2);pan 端点缓速回摆(boomerang)铺满上限;zoom 单调。
        var TRAVEL_MIN = 100, TRAVEL_MAX = 420, SLACK_USE = 0.8, Z_CAP = 2;

        var tl = gsap.timeline({ paused: true });
        window.__timelines["bg-video-portrait"] = tl;

        function buildAll(mw, mh) {
          if (!mw || !mh) { mw = w; mh = h; }
          var cs = Math.max(w / mw, h / mh), rw = mw * cs, rh = mh * cs;
          var Z = maxZoom, travel = 0;
          if (mv.ax) {
            var view = mv.ax === "x" ? w : h, rend = mv.ax === "x" ? rw : rh;
            var zNeed = (view + TRAVEL_MIN / SLACK_USE) / rend;
            Z = Math.min(Z_CAP, Math.max(maxZoom, zNeed));
            travel = Math.min(SLACK_USE * (Z * rend - view), TRAVEL_MAX);
          }
          function val(v) { return v === "Z" ? Z : v === "P" ? travel * 0.5 : v === "-P" ? -travel * 0.5 : v; }
          tl.clear();
          tl.set(wrap, { transformOrigin: (fx * 100).toFixed(1) + "% " + (fy * 100).toFixed(1) + "%", scale: val(mv.s0), x: val(mv.x0), y: val(mv.y0) }, 0);
          tl.to(wrap, { opacity: 1, duration: introDur, ease: "power2.out" }, 0);
          tl.to(scrimEl, { opacity: scrim, duration: introDur, ease: "power2.out" }, 0);
          var moveStart = Math.min(introDur * 0.3, sceneDur);
          if (mv.ax && travel > 0) {
            var p1 = { x: val(mv.x1), y: val(mv.y1) }, p0 = { x: val(mv.x0), y: val(mv.y0) };
            var leg = Math.max(0.5, (sceneDur - moveStart) / 2), tt = moveStart, flip = false;
            while (tt < DUR - 0.01) {
              var d = Math.min(leg, DUR - tt);
              tl.to(wrap, { x: (flip ? p0 : p1).x, y: (flip ? p0 : p1).y, duration: d, ease: "power1.inOut" }, tt);
              flip = !flip; tt += d;
            }
          } else {
            tl.to(wrap, { scale: val(mv.s1), x: val(mv.x1), y: val(mv.y1), duration: Math.max(0.1, sceneDur - moveStart), ease: "none" }, moveStart);
          }
          if (tl.duration() < DUR) tl.set({}, {}, DUR);
        }

        function dims() { return (video.readyState >= 1 && video.videoWidth) ? [video.videoWidth, video.videoHeight] : null; }
        var d0 = dims();
        buildAll(d0 ? d0[0] : w, d0 ? d0[1] : h);
        if (!d0) {
          var onMeta = function () { var dd = dims(); if (dd) { buildAll(dd[0], dd[1]); video.removeEventListener("loadedmetadata", onMeta); } };
          video.addEventListener("loadedmetadata", onMeta);
        }
      })();
    </script>
  </body>
</html>
