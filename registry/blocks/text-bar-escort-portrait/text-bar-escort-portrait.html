<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Text","description":"Lines separated by \\n; *word* = emphasized (accent color)","default":"新能源革命\\n2026 *关键拐点*","maxLength":300},
    {"id":"interval","type":"number","label":"Interval","description":"Stagger between lines in seconds (0.1-0.8)","default":0.28,"min":0.1,"max":0.8,"step":0.02},
    {"id":"duration","type":"number","label":"Duration","description":"Line slide seconds (0.3-1.2)","default":0.6,"min":0.3,"max":1.2,"step":0.05},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (28-160)","default":72,"min":28,"max":160,"step":2},
    {"id":"color","type":"color","label":"Ink","description":"Text color","default":"#f1f5f9"},
    {"id":"accent","type":"color","label":"Accent","description":"Escort bar + emphasized word color","default":"#f97316"},
    {"id":"intro","type":"number","label":"Delay","description":"Seconds before the bar sweeps in (0-2)","default":0.2,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-bar-escort-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tbe-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #tbe-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10%; }
      #tbe-body { position: relative; padding-left: 0.9em; font-weight: 700; line-height: 1.5; text-align: left;
        font-family: "Noto Sans SC", sans-serif; }
      #tbe-bar { position: absolute; left: 0; top: 50%; width: 0.16em; border-radius: 0.08em; background: #f97316; }
      .tbe-line { display: block; will-change: transform, opacity; white-space: pre-wrap; }
      .tbe-em { color: #f97316; }
    </style>
  </head>
  <body>
    <div id="tbe-root"
      data-composition-id="text-bar-escort-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="tbe-box"><div id="tbe-body"><div id="tbe-bar"></div></div></div>
      <div id="tbe-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var interval = clamp(V.interval, 0.1, 0.8, 0.28);
        var dur = clamp(V.duration, 0.3, 1.2, 0.6);
        var fontSize = clamp(V.font_size, 28, 160, 72);
        var ink = V.color || "#f1f5f9";
        var accent = V.accent || "#f97316";
        var delay0 = clamp(V.intro, 0, 2, 0.2);

        var body = document.getElementById("tbe-body");
        var bar = document.getElementById("tbe-bar");
        body.style.fontSize = fontSize + "px";
        body.style.color = ink;
        bar.style.background = accent;

        // *强调* 标记 → 行内 span(整行滑动,行内不再拆单元——护送是行级手法)
        var lines = [];
        String(V.text == null ? "" : V.text).split(/\\n|\n/).forEach(function (line) {
          var el = document.createElement("span");
          el.className = "tbe-line";
          var re = /\*([^*]+)\*/g, last = 0, m;
          while ((m = re.exec(line))) {
            if (m.index > last) el.appendChild(document.createTextNode(line.slice(last, m.index)));
            var em = document.createElement("span");
            em.className = "tbe-em";
            em.textContent = m[1];
            el.appendChild(em);
            last = m.index + m[0].length;
          }
          if (last < line.length) el.appendChild(document.createTextNode(line.slice(last)));
          if (!el.childNodes.length) el.textContent = line;
          body.appendChild(el);
          lines.push(el);
        });

        // 条形护送:竖条从左侧扫入(高度过冲落定)→ 各行从条后滑出(x: 条位→0),错峰;条在末行落定后脉冲一次
        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-bar-escort-portrait"] = tl;
        tl.fromTo(bar,
          { scaleY: 0 },
          { scaleY: 1, transformOrigin: "center top", duration: 0.42, ease: "power3.out" }, delay0);
        lines.forEach(function (el, i) {
          tl.fromTo(el,
            { x: -fontSize * 1.1, opacity: 0 },
            { x: 0, opacity: 1, duration: dur, ease: "power3.out" },
            delay0 + 0.3 + i * interval);
        });
        tl.to(bar, { scaleX: 1.35, transformOrigin: "left center", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut" },
          delay0 + 0.3 + lines.length * interval + dur * 0.4);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
      })();
    </script>
  </body>
</html>
