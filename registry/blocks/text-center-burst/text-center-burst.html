<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Text","description":"Text; \\n = line break; *word* = emphasized (accent color)","default":"数据驱动 *决策*","maxLength":400},
    {"id":"scatter","type":"number","label":"Scatter","description":"Burst scatter radius in px (80-600)","default":280,"min":80,"max":600,"step":20},
    {"id":"interval","type":"number","label":"Interval","description":"Stagger between units in seconds (0.02-0.3)","default":0.06,"min":0.02,"max":0.3,"step":0.01},
    {"id":"duration","type":"number","label":"Duration","description":"Convergence seconds per unit (0.4-1.4)","default":0.7,"min":0.4,"max":1.4,"step":0.05},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (24-220)","default":96,"min":24,"max":220,"step":2},
    {"id":"color","type":"color","label":"Ink","description":"Final text color","default":"#f1f5f9"},
    {"id":"accent","type":"color","label":"Accent","description":"Emphasized (*marked*) unit color","default":"#f472b6"},
    {"id":"intro","type":"number","label":"Delay","description":"Seconds before the burst starts (0-2)","default":0.2,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-center-burst</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tcb-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #tcb-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8%; }
      #tcb-body { max-width: 100%; text-align: center; font-weight: 800; line-height: 1.3;
        font-family: "Noto Sans SC", sans-serif; }
      .tcb-line { display: block; }
      .tcb-u { display: inline-block; will-change: transform, opacity, color; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="tcb-root"
      data-composition-id="text-center-burst"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="tcb-box"><div id="tcb-body"></div></div>
      <div id="tcb-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }
        function hash01(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var scatter = clamp(V.scatter, 80, 600, 280);
        var interval = clamp(V.interval, 0.02, 0.3, 0.06);
        var dur = clamp(V.duration, 0.4, 1.4, 0.7);
        var fontSize = clamp(V.font_size, 24, 220, 96);
        var ink = V.color || "#f1f5f9";
        var accent = V.accent || "#f472b6";
        var delay0 = clamp(V.intro, 0, 2, 0.2);

        var root = document.getElementById("tcb-root");
        var body = document.getElementById("tcb-body");
        body.style.fontSize = fontSize + "px";

        // CJK 分词核心(word 级,退化逐字;尾随空白并入前单元)
        function segRuns(line) {
          var units = [], re = /\*([^*]+)\*/g, last = 0, m;
          function push(t, emph) {
            if (!t) return;
            if (/^\s+$/.test(t) && units.length) { units[units.length - 1].text += t; return; }
            units.push({ text: t, emph: emph });
          }
          function segment(str, emph) {
            if (typeof Intl !== "undefined" && Intl.Segmenter)
              Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(str)).forEach(function (s) { push(s.segment, emph); });
            else Array.from(str).forEach(function (ch) { push(ch, emph); });
          }
          while ((m = re.exec(line))) {
            if (m.index > last) segment(line.slice(last, m.index), false);
            segment(m[1], true);
            last = m.index + m[0].length;
          }
          if (last < line.length) segment(line.slice(last), false);
          return units;
        }

        var spans = [];
        String(V.text == null ? "" : V.text).split(/\\n|\n/).forEach(function (line) {
          if (line === "" && spans.length) { body.appendChild(document.createElement("br")); return; }
          var div = document.createElement("span");
          div.className = "tcb-line";
          segRuns(line).forEach(function (u) {
            var el = document.createElement("span");
            el.className = "tcb-u";
            el.textContent = u.text;
            var finalColor = u.emph ? accent : ink;
            el.style.color = finalColor;
            el.setAttribute("data-final", finalColor);
            if (u.emph) el.style.textShadow = "0 0 26px " + accent + "55";
            div.appendChild(el);
            spans.push(el);
          });
          body.appendChild(div);
        });

        // 中心爆发:各单元从「指向画布中心 + 确定性散布」的爆点收敛落定(back.out),途中彩色 → 落定色
        // 度量依赖 webfont:fonts.ready 后清轨重建(同 bg-image 素材就绪重建模式)
        var cx = (root.clientWidth || 1920) / 2, cy = (root.clientHeight || 1080) / 2;
        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-center-burst"] = tl;
        function build() {
          tl.clear();
          spans.forEach(function (el, i) {
            var r = el.getBoundingClientRect();
            var ox = r.left + r.width / 2 - (root.getBoundingClientRect().left || 0) - cx;
            var oy = r.top + r.height / 2 - (root.getBoundingClientRect().top || 0) - cy;
            var ang = hash01(i) * 2 * Math.PI;
            var rad = scatter * (0.55 + 0.45 * hash01(i + 57));
            var fx = -ox + Math.cos(ang) * rad, fy = -oy + Math.sin(ang) * rad;
            var hue = Math.round(hash01(i + 91) * 360);
            tl.fromTo(el,
              { x: fx, y: fy, rotation: (hash01(i + 13) - 0.5) * 80, scale: 1.5, opacity: 0, color: "hsl(" + hue + ",85%,62%)" },
              { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, color: el.getAttribute("data-final"), duration: dur, ease: "back.out(1.4)" },
              delay0 + i * interval);
          });
          if (tl.duration() < DUR) tl.set({}, {}, DUR);
        }
        build();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { build(); });
      })();
    </script>
  </body>
</html>
