<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"colors","type":"string","label":"Colors","description":"Comma-separated hex list, e.g. #3b82f6,#8b5cf6,#db2777","default":"#3b82f6,#8b5cf6,#db2777,#f59e0b","maxLength":200},
    {"id":"density","type":"number","label":"Density","description":"Blob count (3-8; 8 = full edge-midpoint + corner track set)","default":8,"min":3,"max":8,"step":1},
    {"id":"speed","type":"number","label":"Speed","description":"Drift speed feel (10-200)","default":50,"min":10,"max":200,"step":10},
    {"id":"intensity","type":"number","label":"Intensity","description":"Blob deformation 0-1","default":0.6,"min":0,"max":1,"step":0.05},
    {"id":"base","type":"enum","label":"Base","description":"Light or dark canvas base","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]},
    {"id":"bg","type":"color","label":"Background","description":"Canvas base color (default follows base)","default":""},
    {"id":"scrim","type":"number","label":"Scrim","description":"Black overlay strength for text readability 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"dim","type":"number","label":"Dim","description":"De-bright / de-saturate 0-1","default":0,"min":0,"max":1,"step":0.05},
    {"id":"intro","type":"number","label":"Intro","description":"Fade-in seconds","default":0.6,"min":0,"max":3,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>bg-aurora-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #ffffff; overflow: hidden; }
      #bga-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #bga-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
      #bga-scrim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bga-root"
      data-composition-id="bg-aurora-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="bga-canvas"></canvas>
      <div id="bga-scrim"></div>
      <div id="bga-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;          // manifest duration = 2 × LOOP_CYCLE
        var LOOP_CYCLE = 30;   // 五轮:直径 1.5×长边 → 轨迹加大,LC 拉长保平移 ~230px/s;自旋倍频上调保实时速度

        function hash01(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var colors = String(V.colors || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        if (!colors.length) colors = ["#3b82f6", "#8b5cf6", "#db2777", "#f59e0b"];
        var density = clamp(V.density, 3, 8, 8);
        var speed = clamp(V.speed, 10, 200, 50);
        var intensity = clamp(V.intensity, 0, 1, 0.6);
        var dark = V.base === "dark";
        var bg = V.bg || (dark ? "#0a0a12" : "#ffffff");
        var scrim = clamp(V.scrim, 0, 1, 0);
        var dim = clamp(V.dim, 0, 1, 0);
        var introDur = clamp(V.intro, 0, 3, 0.6);
        var freq = Math.max(1, Math.min(4, Math.round(speed / 50)));

        var root = document.getElementById("bga-root");
        var canvas = document.getElementById("bga-canvas");
        var scrimEl = document.getElementById("bga-scrim");
        var w = root.clientWidth || 1920, h = root.clientHeight || 1080;
        canvas.width = w; canvas.height = h;
        if (dim > 0) canvas.style.filter = "brightness(" + (1 - 0.45 * dim) + ") saturate(" + (1 - 0.6 * dim) + ")";
        var ctx = canvas.getContext("2d");

        var N = 24;
        var Ld = Math.max(w, h);   // 长边:色块直径/圆心偏移/轨迹半径的统一基准
        var D = Math.max(3, Math.min(8, Math.round(density)));

        // 八条圆轨道(九轮定案):a 组四边中点(0-3)+ b 组四角(4-7);圆心距 0.65/0.75·Ld
        // 对角对(0,2)(1,3)(4,6)(5,7)相位差半周期 —— 你进(θ=π 最深入)我正好退(θ=0 出画)
        // 九轮约束:单块覆盖 ≤50%(直径 ~0.6·Ld 为几何上限) + 同屏 ≥3 块(八相位均匀 × 可见窗 ~46% → 3-4 块恒在)
        var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0], [0.7071, -0.7071], [0.7071, 0.7071], [-0.7071, 0.7071], [-0.7071, -0.7071]];
        var PHIS = [0, 0.125, 0.5, 0.625, 0.25, 0.375, 0.75, 0.875];       // 对角差 0.5,全集均匀铺开(每 1/8 周期一块到极位)
        // 轨迹半径 = 圆心距 + 0.3·Ld:θ=0(wrap)落在画外 1.6/1.8·Ld(完全出画,含呼吸/变形余量);
        // θ=π 越过屏幕中心 0.3·Ld(深度穿屏)。勿单独加大半径 —— 会把整圆推出可视范围(七轮事故)。
        function trackD(i) { return (i < 4 ? 0.65 : 0.75) * Ld; }

        // ---- 唯一色派生(十一轮:同一色彩禁止碰撞/拼接)----
        // 有限调色板 × 必须互相重叠的覆盖几何 → 同色相碰不可避免;改为全局唯一色:
        // 重复取色时向白/黑交替偏移 12% 成可分辨色阶,任何两块不同色 → 拼接在构造上绝迹
        var ci = 0;
        function mixHex(h1, h2, t) {
          var ok = /^#[0-9a-f]{6}$/i;
          if (!ok.test(h1) || !ok.test(h2)) return h1;
          var a = [parseInt(h1.slice(1, 3), 16), parseInt(h1.slice(3, 5), 16), parseInt(h1.slice(5, 7), 16)];
          var b = [parseInt(h2.slice(1, 3), 16), parseInt(h2.slice(3, 5), 16), parseInt(h2.slice(5, 7), 16)];
          var r = Math.round(a[0] + (b[0] - a[0]) * t), g = Math.round(a[1] + (b[1] - a[1]) * t), c2 = Math.round(a[2] + (b[2] - a[2]) * t);
          return "#" + ((1 << 24) + (r << 16) + (g << 8) + c2).toString(16).slice(1);
        }
        function uc() {
          var base = colors[ci % colors.length], rep = Math.floor(ci / colors.length);
          ci++;
          return rep ? mixHex(base, rep % 2 ? "#ffffff" : "#000000", 0.12 * Math.ceil(rep / 2)) : base;
        }

        var blobs = [];
        for (var i = 0; i < D; i++) {
          // 每组谐波独立:方向 ±、整数倍频 vf、振幅脉动 gf —— 混向混频 → 轮廓不规则变形
          // 振幅按谐波阶数递减(Σ≤0.54 → rr 恒正)
          var AMP = [0, 0.16, 0.12, 0.09, 0.06];
          var harm = [];
          for (var m = 1; m <= 4; m++) harm.push({
            a: AMP[m] * (0.75 + 0.5 * hash01(i * 11 + m * 3)) * intensity, w: m,
            psi: hash01(i * 17 + m * 7) * Math.PI * 2,
            dir: hash01(i * 29 + m * 5) < 0.5 ? -1 : 1,
            vf: 3 + Math.floor(hash01(i * 37 + m * 11) * 5),
            gf: 1 + Math.floor(hash01(i * 43 + m * 17) * 2),
            pf: hash01(i * 41 + m * 13) * Math.PI * 2
          });
          var Dc = trackD(i);
          blobs.push({
            phi: PHIS[i],
            ux: DIRS[i][0], uy: DIRS[i][1],
            ccx: w / 2 + Dc * DIRS[i][0], ccy: h / 2 + Dc * DIRS[i][1],
            Rt: Dc + 0.3 * Ld, rot: (Math.floor(i / 2) % 2 ? 1 : -1),       // 绕圆方向按对交替
            rp: hash01(i * 13 + 11) * Math.PI * 2,                          // R 呼吸相位
            R: (0.28 + 0.03 * hash01(i * 23 + 5)) * Ld,                     // 直径 ~0.6×长边:最深位覆盖 ≤50% 面积的几何上限(1.5× 与 ≤50% 不相容)
            harm: harm,
            color: uc()                                                     // 全局唯一色(十一轮:同色碰撞构造性绝迹)
          });
        }

        function traceBlob(b, cx, cy, R, ph) {
          var pts = [];
          for (var k = 0; k < N; k++) {
            var th = 2 * Math.PI * k / N, rr = 1;
            for (var hi = 0; hi < b.harm.length; hi++) {
              var hm = b.harm[hi];
              var amp = hm.a * (0.7 + 0.3 * Math.sin(2 * Math.PI * hm.gf * ph + hm.pf));   // 振幅脉动 → 呼吸式变形
              rr += amp * Math.sin(hm.w * th + hm.dir * 2 * Math.PI * hm.vf * ph + hm.psi);
            }
            pts.push([cx + Math.cos(th) * R * rr, cy + Math.sin(th) * R * rr]);
          }
          function mid(a, c) { return [(a[0] + c[0]) / 2, (a[1] + c[1]) / 2]; }
          ctx.beginPath();
          var m0 = mid(pts[N - 1], pts[0]); ctx.moveTo(m0[0], m0[1]);
          for (var k2 = 0; k2 < N; k2++) { var nxt = pts[(k2 + 1) % N]; var mm = mid(pts[k2], nxt); ctx.quadraticCurveTo(pts[k2][0], pts[k2][1], mm[0], mm[1]); }
          ctx.closePath();
        }

        // 纯函数 draw:极坐标谐波扰动闭合路径 + 中心全 sin 周期 → seamless
        function draw(t, a) {
          var ph = t / LOOP_CYCLE;
          ctx.globalAlpha = 1; ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
          // 底保层:不透明,先铺满(除入场 a<1 期间,底色不露出);全部公转,禁止静止
          for (var ui = 0; ui < under.length; ui++) {
            var ub = under[ui];
            var ux2 = ub.ocx + ub.oR * Math.cos(2 * Math.PI * ub.ov * ph + ub.op);
            var uy2 = ub.ocy + ub.oR * Math.sin(2 * Math.PI * ub.ov * ph + ub.op);
            traceBlob(ub, ux2, uy2, ub.R, ph);
            ctx.globalAlpha = a; ctx.fillStyle = ub.color; ctx.fill();
          }
          // 资历序绘制:progress = frac(ph + phi) 升序 → 在屏最久者最后画(最上层);
          // wrap(progress 1→0)发生在色块完全出画时,从顶层掉到底层 → zIndex 切换不可见
          var order = [];
          for (var oi = 0; oi < D; oi++) order.push(oi);
          order.sort(function (p, q) { return ((ph + blobs[p].phi) % 1) - ((ph + blobs[q].phi) % 1); });
          for (var si = 0; si < order.length; si++) {
            var i = order[si], b = blobs[i];
            var pgr = (ph + b.phi) % 1;
            var th = b.rot * 2 * Math.PI * pgr;                     // θ=0 = 沿本轨外向(wrap 完全出画),θ=π 深入对侧
            var cx = b.ccx + Math.cos(th) * b.Rt;
            var cy = b.ccy + Math.sin(th) * b.Rt;
            var Rp = b.R * (1 + 0.12 * Math.sin(2 * Math.PI * (1 + i % 3) * ph + b.rp));
            traceBlob(b, cx, cy, Rp, ph);
            ctx.globalAlpha = 0.95 * a; ctx.fillStyle = b.color; ctx.fill();
          }
          ctx.globalAlpha = 0.22 * a; ctx.strokeStyle = dark ? "#67e8f9" : "#f9a8d4"; ctx.lineWidth = 1.5;
          for (var L = 0; L < 3; L++) {
            ctx.beginPath();
            for (var s = 0; s <= 40; s++) {
              var u = s / 40, x = w * (0.45 + 0.5 * u);
              var y = h * (0.05 + 0.12 * L) + Math.sin(2 * Math.PI * (freq * ph + u * 2 + L * 0.4)) * 30;
              if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }

        // 底保层(十轮全覆盖 + 十一轮全动):环边 8 圆绕驻点公转(轨道 0.06·Ld)+ 中心 3 圆绕屏心
        // 旋转(轨道 0.05·Ld,三相对称)补中心洞;全覆盖几何按 0.9 覆盖折减核算过;微变形保有生命感
        var AMPU = [0, 0.04, 0.03, 0.02, 0.01];
        var Cu = 0.62 * Ld;
        var under = [];
        for (var u = 0; u < 11; u++) {
          var hu = [];
          for (var m2 = 1; m2 <= 4; m2++) hu.push({
            a: AMPU[m2] * intensity, w: m2, psi: hash01(u * 19 + m2 * 23) * Math.PI * 2,
            dir: hash01(u * 3 + m2) < 0.5 ? -1 : 1, vf: 2 + Math.floor(hash01(u * 5 + m2 * 2) * 3),
            gf: 1, pf: hash01(u * 7 + m2 * 3) * Math.PI * 2
          });
          var ring = u < 8, cn = ring ? DIRS[u] : [Math.cos(2 * Math.PI * (u - 8) / 3), Math.sin(2 * Math.PI * (u - 8) / 3)];
          var park = ring ? Cu : 0;                     // 三角三块驻点=屏心,靠公转半径铺开
          under.push({
            ocx: w / 2 + park * cn[0], ocy: h / 2 + park * cn[1],
            oR: (ring ? 0.06 : 0.05) * Ld, op: hash01(u * 9 + 2) * Math.PI * 2, ov: 1,
            R: (ring ? 0.50 : 0.26) * Ld, harm: hu, color: uc()
          });
        }

        var _st = { _t: 0, _a: 0 };
        Object.defineProperty(_st, "t", { configurable: true, get: function () { return _st._t; }, set: function (v) { _st._t = v; draw(_st._t, _st._a); } });
        Object.defineProperty(_st, "a", { configurable: true, get: function () { return _st._a; }, set: function (v) { _st._a = v; draw(_st._t, _st._a); } });

        var tl = gsap.timeline({ paused: true });
        tl.to(_st, { t: DUR, duration: DUR, ease: "none" }, 0);
        tl.to(_st, { a: 1, duration: introDur, ease: "power2.out" }, 0);
        tl.to(scrimEl, { opacity: scrim, duration: introDur, ease: "power2.out" }, 0);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
        draw(0, 0);
        window.__timelines["bg-aurora-portrait"] = tl;
      })();
    </script>
  </body>
</html>
