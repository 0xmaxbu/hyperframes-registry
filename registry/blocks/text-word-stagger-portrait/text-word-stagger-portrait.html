<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Text","description":"Text; \\n = line break; *word* = emphasized (accent color)","default":"数据是新时代的 *石油*","maxLength":400},
    {"id":"unit","type":"enum","label":"Unit","description":"Animation unit: CJK-aware word segmentation or single characters","default":"word","options":[{"value":"word","label":"Word (CJK-segmented)"},{"value":"char","label":"Character"}]},
    {"id":"direction","type":"enum","label":"Direction","description":"Entrance direction of each unit","default":"up","options":[{"value":"up","label":"Rise up"},{"value":"down","label":"Drop down"},{"value":"left","label":"From left"},{"value":"right","label":"From right"},{"value":"scale","label":"Scale in"}]},
    {"id":"interval","type":"number","label":"Interval","description":"Stagger between units in seconds (0.02-0.3)","default":0.08,"min":0.02,"max":0.3,"step":0.01},
    {"id":"duration","type":"number","label":"Duration","description":"Each unit entrance seconds (0.3-1.2)","default":0.55,"min":0.3,"max":1.2,"step":0.05},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (24-220)","default":84,"min":24,"max":220,"step":2},
    {"id":"color","type":"color","label":"Ink","description":"Text color","default":"#f1f5f9"},
    {"id":"accent","type":"color","label":"Accent","description":"Emphasized (*marked*) unit color","default":"#fbbf24"},
    {"id":"intro","type":"number","label":"Delay","description":"Seconds before the first unit starts (0-2)","default":0.2,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-word-stagger-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tws-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #tws-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8%; }
      #tws-body { max-width: 100%; text-align: center; font-weight: 700; line-height: 1.32;
        font-family: "Noto Sans SC", sans-serif; }
      .tws-line { display: block; }
      .tws-u { display: inline-block; will-change: transform, opacity; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="tws-root"
      data-composition-id="text-word-stagger-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="tws-box"><div id="tws-body"></div></div>
      <div id="tws-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;

        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var unit = V.unit === "char" ? "char" : "word";
        var direction = ["up", "down", "left", "right", "scale"].indexOf(V.direction) >= 0 ? V.direction : "up";
        var interval = clamp(V.interval, 0.02, 0.3, 0.08);
        var dur = clamp(V.duration, 0.3, 1.2, 0.55);
        var fontSize = clamp(V.font_size, 24, 220, 84);
        var ink = V.color || "#f1f5f9";
        var accent = V.accent || "#fbbf24";
        var delay0 = clamp(V.intro, 0, 2, 0.2);

        var root = document.getElementById("tws-root");
        var body = document.getElementById("tws-body");
        body.style.fontSize = fontSize + "px";
        body.style.color = ink;

        // ---- CJK 感知分词:word 模式 Intl.Segmenter(退化逐字),char 模式逐字;尾随空白并入前单元 ----
        function segmentLine(str, emph) {
          var units = [];
          if (unit === "char" || !(typeof Intl !== "undefined" && Intl.Segmenter)) {
            Array.from(str).forEach(function (ch) { push(ch); });
          } else {
            Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(str)).forEach(function (s) { push(s.segment); });
          }
          function push(t) {
            if (!t) return;
            if (/^\s+$/.test(t) && units.length) { units[units.length - 1].text += t; return; }
            units.push({ text: t, emph: emph });
          }
          return units;
        }

        // *强调* 内联标记 → 分段 runs → 逐段分词
        function parseLine(line) {
          var units = [], re = /\*([^*]+)\*/g, last = 0, m;
          while ((m = re.exec(line))) {
            if (m.index > last) units = units.concat(segmentLine(line.slice(last, m.index), false));
            units = units.concat(segmentLine(m[1], true));
            last = m.index + m[0].length;
          }
          if (last < line.length) units = units.concat(segmentLine(line.slice(last), false));
          return units;
        }

        var spans = [];
        String(V.text == null ? "" : V.text).split(/\\n|\n/).forEach(function (line) {
          if (line === "" && spans.length) { body.appendChild(document.createElement("br")); return; }
          var div = document.createElement("span");
          div.className = "tws-line";
          parseLine(line.replace(/\\n/g, "")).forEach(function (u) {
            var el = document.createElement("span");
            el.className = "tws-u";
            el.textContent = u.text;
            if (u.emph) { el.style.color = accent; el.style.textShadow = "0 0 24px " + accent + "55"; }
            div.appendChild(el);
            spans.push(el);
          });
          body.appendChild(div);
        });

        // ---- 入场:按 direction 设起点,错峰 power3.out;scale 用 back.out 落定 ----
        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-word-stagger-portrait"] = tl;
        var FROM = {
          up:    { y:  fontSize * 0.55, x: 0, scale: 1 },
          down:  { y: -fontSize * 0.55, x: 0, scale: 1 },
          left:  { x: -fontSize * 1.2, y: 0, scale: 1 },
          right: { x:  fontSize * 1.2, y: 0, scale: 1 },
          scale: { x: 0, y: 0, scale: 0.45 }
        }[direction];
        spans.forEach(function (el, i) {
          tl.fromTo(el,
            { x: FROM.x, y: FROM.y, scale: FROM.scale, opacity: 0 },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: dur, ease: direction === "scale" ? "back.out(1.6)" : "power3.out" },
            delay0 + i * interval);
        });
        if (tl.duration() < DUR) tl.set({}, {}, DUR);                 // 驻留铺满,宿主任意裁剪
      })();
    </script>
  </body>
</html>
