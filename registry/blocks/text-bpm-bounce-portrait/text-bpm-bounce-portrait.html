<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"text","type":"string","label":"Words","description":"Words separated by spaces or \\n; each word bounces on its own beat (default text = 5 words, loop 2.5s at 120 BPM)","default":"降 本 增 效 提 质","maxLength":200},
    {"id":"bpm","type":"number","label":"BPM","description":"Beats per minute (60-180); loop = word count × 60/bpm","default":120,"min":60,"max":180,"step":1},
    {"id":"font_size","type":"number","label":"Font size","description":"Font size in px (28-160)","default":100,"min":28,"max":160,"step":2},
    {"id":"hop","type":"number","label":"Hop","description":"Bounce strength 0-1 (scale + hop height)","default":0.7,"min":0,"max":1,"step":0.05},
    {"id":"color","type":"color","label":"Ink","description":"Resting word color","default":"#94a3b8"},
    {"id":"accent","type":"color","label":"Accent","description":"Bouncing word color","default":"#f97316"},
    {"id":"intro","type":"number","label":"Delay","description":"Fade-in seconds before bouncing starts (0-2)","default":0.4,"min":0,"max":2,"step":0.1}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>text-bpm-bounce-portrait</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #tbb-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #tbb-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8%; }
      #tbb-body { max-width: 100%; text-align: center; font-weight: 900; line-height: 1.6;
        font-family: "Noto Sans SC", sans-serif; }
      .tbb-u { display: inline-block; margin: 0 0.3em; will-change: transform, color; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="tbb-root"
      data-composition-id="text-bpm-bounce-portrait"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="tbb-box"><div id="tbb-body"></div></div>
      <div id="tbb-drv" class="clip" data-start="0" data-duration="60" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        var DUR = 60;
        function clamp(v, lo, hi, d) { return v != null ? Math.max(lo, Math.min(hi, Number(v))) : d; }

        var V = {};
        try { V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {}; } catch (e) { V = {}; }
        var bpm = clamp(V.bpm, 60, 180, 120);
        var fontSize = clamp(V.font_size, 28, 160, 100);
        var hop = clamp(V.hop, 0, 1, 0.7);
        var ink = V.color || "#94a3b8";
        var accent = V.accent || "#f97316";
        var introDur = clamp(V.intro, 0, 2, 0.4);

        var body = document.getElementById("tbb-body");
        body.style.fontSize = fontSize + "px";

        var words = String(V.text == null ? "" : V.text).split(/[\s\n]+|\\n/).filter(Boolean);
        if (words.length < 2) words = ["降", "本", "增", "效", "提", "质"];
        var N = words.length;
        var els = words.map(function (wd, i) {
          var el = document.createElement("span");
          el.className = "tbb-u";
          el.textContent = wd;
          body.appendChild(el);
          if (i < N - 1) body.appendChild(document.createTextNode(" "));
          return el;
        });

        // 节拍弹跳:第 i 词在自己的拍位上跳(beat mod N == i),包络 sin(π·min(1,u·3))·e^(−2.5u)
        // 周期 = N 拍 → 无缝循环;确定性 t 函数,无随机
        var LC = N * 60 / bpm;
        var _t = 0;
        function draw(t) {
          _t = t;
          var beat = t * bpm / 60;
          for (var i = 0; i < N; i++) {
            var u = beat - i;
            u = u - Math.floor(u / N) * N;                   // (beat − i) mod N ∈ [0,N)
            var s = u < 1 ? Math.sin(Math.PI * Math.min(1, u * 3)) * Math.exp(-2.5 * u) : 0;
            els[i].style.transform = "translateY(" + (-fontSize * 0.22 * hop * s).toFixed(2) + "px) scale(" + (1 + 0.24 * hop * s).toFixed(4) + ")";
            els[i].style.color = s > 0.25 ? accent : ink;
            els[i].style.textShadow = s > 0.25 ? "0 0 " + (26 * s).toFixed(0) + "px " + accent + "55" : "none";
          }
        }
        var st = {};
        Object.defineProperty(st, "t", { get: function () { return _t; }, set: function (v) { draw(v); } });

        var tl = gsap.timeline({ paused: true });
        window.__timelines["text-bpm-bounce-portrait"] = tl;
        draw(0);
        tl.fromTo(body, { opacity: 0 }, { opacity: 1, duration: introDur, ease: "power2.out" }, 0);
        tl.to(st, { t: DUR, duration: DUR, ease: "none" }, 0);
        if (tl.duration() < DUR) tl.set({}, {}, DUR);
      })();
    </script>
  </body>
</html>
