<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>preset-sequence-layers — 单手法 Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
      html, body { background: #05060d; color: #eef1ff; font-family: "JetBrains Mono", "PingFang SC", monospace; overflow: hidden; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      header { position: absolute; top: 0; left: 0; right: 0; height: 84px; padding: 18px 32px;
        display: flex; align-items: baseline; gap: 20px; z-index: 20;
        background: linear-gradient(180deg, rgba(5,6,13,0.92), transparent);
      }
      header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.1em; color: #5eead4; }
      header .sub { font-size: 11px; color: #aeb6d4; letter-spacing: 0.05em; }
      .stage-wrap { position: absolute; top: 92px; bottom: 0; left: 0; right: 0;
        display: flex; gap: 28px; padding: 0 32px 24px; }
      .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
      .col h2 { font-size: 12px; color: #b7bfdd; letter-spacing: 0.08em; }
      .col h2 b { color: #eef1ff; }
      .stage { position: relative; flex: 1; overflow: hidden; border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.09); background: #0b1220;
        box-shadow: inset 0 0 60px rgba(0,0,0,0.5); }
      .stage .tag { position: absolute; top: 10px; left: 12px; font-size: 10px; color: #a6aed0;
        letter-spacing: 0.12em; z-index: 5; }
      /* block 挂载 wrapper：由 JS 按 stage 可用尺寸缩放 block（block 保持原生 1920×1080/1080×1920） */
      .hf-stage { position: absolute; inset: 0; overflow: hidden; }
      .hf-block { position: absolute; transform-origin: 0 0; }
      #demo-note { position: absolute; bottom: 18px; right: 32px; z-index: 30;
        font-size: 10px; color: #99a1c4; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="preset-sequence-layers-demo" data-width="1920" data-height="1080" data-duration="14">
      <header>
        <h1>③ SEQUENCE-LAYERS</h1>
        <span class="sub">图层叠盖 · N 个大容器共享同一锚区 · 新层从旧层后翻开盖上去（rotateY 翻盖 + 等差露边）· 逐层递进叙事</span>
      </header>

      <div class="stage-wrap">
        <div class="col">
          <h2>16:9 <b>landscape</b></h2>
          <div class="stage" id="stage-landscape">
            <span class="tag">1920×1080 · preset-sequence-layers</span>
            <div class="hf-stage" id="hf-landscape"></div>
          </div>
        </div>
        <div class="col">
          <h2>9:16 <b>portrait</b></h2>
          <div class="stage" id="stage-portrait">
            <span class="tag">1080×1920 · preset-sequence-layers-portrait</span>
            <div class="hf-stage" id="hf-portrait"></div>
          </div>
        </div>
      </div>

      <div id="demo-note">数据 = 真实因果链 5 环（利息高→赤字大→发债多→溢价高→利息更高）· 双比例并排</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};

        // 真实场景数据（因果链 5 环）
        var ITEMS = [
          { title: "利息高" },
          { title: "赤字大" },
          { title: "发债多" },
          { title: "溢价高" },
          { title: "利息更高" },
        ];
        var VARS = JSON.stringify({
          items: ITEMS,
          config: { interval: 1.4, duration: 0.8 },
          accent: "#f472b6",
        });

        // block 原生尺寸 → 缩放进 stage（stage 可用 = 容器内除 tag 外）
        function mountBlock(el, compId, compSrc, nativeW, nativeH) {
          // 包一层 .hf-block：原生尺寸 + scale 缩放 + 居中（runtime 只改 host，不动 wrapper）
          var block = document.createElement("div");
          block.className = "hf-block";
          block.style.width = nativeW + "px";
          block.style.height = nativeH + "px";
          el.appendChild(block);

          var host = document.createElement("div");
          host.setAttribute("data-composition-id", compId);
          host.setAttribute("data-composition-src", compSrc);
          host.setAttribute("data-start", "0");
          host.setAttribute("data-duration", "14");
          host.setAttribute("data-track-index", "0");
          host.setAttribute("data-width", String(nativeW));
          host.setAttribute("data-height", String(nativeH));
          host.setAttribute("data-variable-values", VARS);
          block.appendChild(host);

          function fit() {
            var stage = el.parentElement;
            var r = stage.getBoundingClientRect();
            // 给 tag 留顶空间
            var availW = r.width;
            var availH = r.height - 28;
            var scale = Math.min(availW / nativeW, availH / nativeH);
            block.style.transform = "scale(" + scale + ")";
            // 居中：left/top = (可用 - 缩放后尺寸)/2
            block.style.left = Math.max(0, (availW - nativeW * scale) / 2) + "px";
            block.style.top = (28 + Math.max(0, (availH - nativeH * scale) / 2)) + "px";
          }
          fit();
          // stage 尺寸在布局稳定后才确定；给一次机会重算
          requestAnimationFrame(fit);
        }

        mountBlock(document.getElementById("hf-landscape"),
          "preset-sequence-layers", "compositions/preset-sequence-layers.html", 1920, 1080);
        mountBlock(document.getElementById("hf-portrait"),
          "preset-sequence-layers-portrait", "compositions/preset-sequence-layers-portrait.html", 1080, 1920);

        // 宿主自己的 timeline（转场由宿主自行编排；此处空）
        var tl = gsap.timeline({ paused: true });
        window.__timelines["preset-sequence-layers-demo"] = tl;
      })();
    </script>
  </body>
</html>
